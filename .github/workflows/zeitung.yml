name: Morgen-Zeitung

on:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 06:17 Uhr (Winterzeit) / 07:17 Uhr (Sommerzeit)
  workflow_dispatch:        # manuell starten: Actions -> Morgen-Zeitung -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # merkt sich gelesene Meldungen zwischen den Läufen (für "NEU")
      - uses: actions/cache@v4
        with:
          path: gelesen.json
          key: gelesen-${{ github.run_id }}
          restore-keys: gelesen-

      - name: Zeitung bauen
        env:
          TZ: Europe/Berlin
        run: python zeitung.py --ausgabe _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

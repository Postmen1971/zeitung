name: Morgen-Zeitung

on:
  schedule:
    # Zwei Morgenläufe, weil GitHub geplante Läufe oft stark verspätet startet (Zeiten in UTC)
    - cron: "23 3 * * *"   # ca. 04:23 Uhr (Winterzeit) / 05:23 Uhr (Sommerzeit)
    - cron: "47 4 * * *"   # ca. 05:47 Uhr (Winterzeit) / 06:47 Uhr (Sommerzeit)
  workflow_dispatch:        # manuell starten: Actions -> Morgen-Zeitung -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    env:
      HAT_ABO_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # merkt sich gelesene Meldungen zwischen den Läufen (für "NEU")
      - uses: actions/cache@v4
        with:
          path: |
            gelesen.json
            artikel_cache.json
            uebersetzt_cache.json
            fonts
          key: gelesen-${{ github.run_id }}
          restore-keys: gelesen-

      - name: Pillow (kleinere Fotos) und PyMuPDF (Seiten für den Blätter-Leser)
        run: pip install --quiet pillow pymupdf

      # Nur wenn das Abo-Token hinterlegt ist: Claude Code installieren (schreibt/übersetzt die Artikel)
      - name: Claude Code installieren (für CLAUDE_CODE_OAUTH_TOKEN)
        if: env.HAT_ABO_TOKEN == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Zeitung bauen
        env:
          TZ: Europe/Berlin
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python zeitung.py --ausgabe _site --pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
